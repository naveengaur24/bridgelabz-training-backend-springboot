# Server port
server.port=${SERVER_PORT}
# Application name
spring.application.name=${APP_NAME}

# Database connection
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# H2 Console - disabled now
# spring.h2.console.enabled=${H2_CONSOLE_ENABLED}
# spring.h2.console.path=${H2_CONSOLE_PATH}

# Hibernate auto table create/update
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
# SQL queries dikhao
spring.jpa.show-sql=${SHOW_SQL}
# SQL formatted dikhao
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL}
# Lazy loading issue avoid
spring.jpa.open-in-view=${OPEN_IN_VIEW}

# Logging level
logging.level.com.fundoonotes=${LOG_LEVEL}
# Log file path
logging.file.name=${LOG_FILE}

# JWT secret key
jwt.secret=${JWT_SECRET}
# JWT expiration time
jwt.expiration=${JWT_EXPIRATION}

# Email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:${RABBITMQ_USERNAME}}